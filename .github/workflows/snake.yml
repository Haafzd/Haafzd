name: Generate Snake

on:
  push:
    branches:
      - main
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate snake animation
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: Haafzd
          github_token: ${{ secrets.CONTRIB_TOKEN }}
          outputs: |
            assets/github-contribution-grid-snake-dark.svg?palette=github-dark
            assets/github-contribution-grid-snake.svg?palette=github-light

      - name: Hide progress bar in SVGs
        run: |
          node -e "
          const fs = require('fs');
          ['assets/github-contribution-grid-snake-dark.svg', 'assets/github-contribution-grid-snake.svg'].forEach(f => {
            if (fs.existsSync(f)) {
              let c = fs.readFileSync(f, 'utf8');
              c = c.replace(/.u{/, '.u{display:none !important;');
              fs.writeFileSync(f, c, 'utf8');
            }
          });
          "

      - name: Commit and push to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/
          git diff --staged --quiet || (git commit -m "chore: update contribution snake [skip ci]" && git pull --rebase origin main && git push origin main)
        env:
          GITHUB_TOKEN: ${{ secrets.CONTRIB_TOKEN }}
